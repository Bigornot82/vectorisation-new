[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorizer-desktop"
version = "0.1.0"
description = "MVP desktop raster-to-SVG vectorizer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PySide6>=6.6",
]

[project.scripts]
vectorizer-desktop = "vectorizer_desktop.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
